name: Python tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: ruff check .
      - name: Run synthetic routing evidence suite
        run: |
          python -m app.evaluation.offline --output artifacts/offline-evaluation | tee offline-evaluation-summary.txt
          python -m integrations.stormscope.demo | tee synthetic-stormscope-demo.txt
      - name: Upload reproducible policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-evaluation-${{ github.run_id }}
          path: |
            artifacts/offline-evaluation/
            offline-evaluation-summary.txt
            synthetic-stormscope-demo.txt
          if-no-files-found: error
          retention-days: 30
