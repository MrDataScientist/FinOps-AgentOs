[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finops-agentos"
version = "0.1.0"
description = "Local-first, policy-gated AI inference routing and cost accounting reference control plane"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1","uvicorn>=0.30,<1","httpx>=0.27,<1","pydantic>=2.8,<3","prometheus-client>=0.20,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*", "integrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E","F","I","UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "integrations"]
